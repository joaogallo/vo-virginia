name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vo-virginia/package-lock.json

      - name: Install dependencies
        working-directory: vo-virginia
        run: npm ci

      - name: Lint
        working-directory: vo-virginia
        run: npm run lint

      - name: Unit & Component Tests
        working-directory: vo-virginia
        run: npm run test:coverage

      - name: Build
        working-directory: vo-virginia
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
